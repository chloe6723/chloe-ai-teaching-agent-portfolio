<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">AI 中文教学智能体系统架构</title>
  <desc id="desc">从教师需求、教学上下文、智能体规划、质量控制到多形态课程交付的完整流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6f4ef"/><stop offset="1" stop-color="#e9eef1"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0b1528" flood-opacity=".11"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#284f8f"/></marker>
    <style>.t{font-family:Inter,'PingFang SC','Microsoft YaHei',sans-serif;fill:#111827}.h{font-size:25px;font-weight:800}.s{font-size:15px;fill:#68707d}.num{font-size:14px;font-weight:900;fill:#fff}.box{fill:#fff;stroke:#dcd9d1;stroke-width:2;filter:url(#shadow)}.line{stroke:#284f8f;stroke-width:4;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="630" rx="26" fill="url(#bg)"/>
  <text x="58" y="67" class="t h" font-size="34">从教学需求到课堂交付</text>
  <text x="58" y="98" class="t s">一条可理解、可验证、可持续复用的 AI 课程生产链路</text>

  <path class="line" d="M236 230 H300"/><path class="line" d="M501 230 H565"/><path class="line" d="M766 230 H830"/>
  <rect class="box" x="40" y="145" width="196" height="170" rx="18"/>
  <circle cx="78" cy="184" r="20" fill="#284f8f"/><text x="73" y="190" class="num">1</text>
  <text x="70" y="233" class="t h">教师需求</text><text x="70" y="265" class="t s">年龄 · 中文等级</text><text x="70" y="291" class="t s">主题 · 时长 · 目标</text>

  <rect class="box" x="300" y="145" width="201" height="170" rx="18"/>
  <circle cx="338" cy="184" r="20" fill="#69aa9f"/><text x="333" y="190" class="num">2</text>
  <text x="330" y="233" class="t h">教学上下文</text><text x="330" y="265" class="t s">匿名学生档案</text><text x="330" y="291" class="t s">历史课程检索</text>

  <rect class="box" x="565" y="145" width="201" height="170" rx="18"/>
  <circle cx="603" cy="184" r="20" fill="#b84a3e"/><text x="598" y="190" class="num">3</text>
  <text x="595" y="233" class="t h">智能体规划</text><text x="595" y="265" class="t s">教学判断与工具调用</text><text x="595" y="291" class="t s">结构化课程蓝图</text>

  <rect class="box" x="830" y="145" width="330" height="170" rx="18"/>
  <circle cx="868" cy="184" r="20" fill="#d6aa55"/><text x="863" y="190" class="num">4</text>
  <text x="860" y="233" class="t h">质量控制</text><text x="860" y="265" class="t s">结构 · 拼音 · 翻译 · 词汇复现</text><text x="860" y="291" class="t s">活动完整性与网页交互检查</text>

  <path class="line" d="M995 315 V375"/>
  <rect class="box" x="660" y="375" width="500" height="185" rx="18" stroke="#69aa9f"/>
  <circle cx="701" cy="417" r="20" fill="#69aa9f"/><text x="696" y="423" class="num">5</text>
  <text x="693" y="466" class="t h">多形态课程交付</text>
  <rect x="693" y="493" width="100" height="37" rx="4" fill="#e6eeef"/><text x="715" y="517" class="t s">互动网页</text>
  <rect x="806" y="493" width="112" height="37" rx="4" fill="#e6eeef"/><text x="828" y="517" class="t s">课程数据</text>
  <rect x="931" y="493" width="100" height="37" rx="4" fill="#e6eeef"/><text x="953" y="517" class="t s">教师教案</text>
  <rect x="1044" y="493" width="88" height="37" rx="4" fill="#e6eeef"/><text x="1062" y="517" class="t s">验证报告</text>

  <rect x="40" y="375" width="540" height="185" rx="18" fill="#0b1528"/>
  <text x="74" y="422" fill="#d6aa55" font-size="16" font-weight="900" font-family="Inter,'PingFang SC',sans-serif">核心设计原则</text>
  <text x="74" y="470" fill="#fff" font-size="24" font-family="'PingFang SC','Microsoft YaHei',sans-serif">模型负责教学判断，程序负责稳定交付。</text>
  <text x="74" y="508" fill="#aab5c6" font-size="17" font-family="'PingFang SC','Microsoft YaHei',sans-serif">既保留个性化生成能力，也让最终结果完整、可检查、可复用。</text>
</svg>
